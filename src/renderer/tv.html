<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' media: data:; media-src media: blob:; font-src 'self'">
<title>Amethyst — TV</title>
<link rel="stylesheet" href="tv.css">
</head>
<body>

<!-- Fundo com o buraco de minhoca (telas de espera, apresentação e nota) -->
<div class="bg" id="bg" aria-hidden="true">
  <svg class="worm" viewBox="300 110 520 280" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <defs>
      <radialGradient id="whGlow" cx="600" cy="232" r="280" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/><stop offset=".45" stop-color="#3a63ff" stop-opacity=".14"/><stop offset="1" stop-color="#3a63ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="whCore" cx="600" cy="232" r="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#c9b8ff"/><stop offset="1" stop-color="#5b2cff" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="600" cy="232" r="280" fill="url(#whGlow)" stroke="none"/>
    <circle cx="580" cy="245" r="200" stroke-width="1.4" stroke-dasharray="0 9" opacity=".3"/>
    <g transform="rotate(-14 580 245)" class="rings">
      <ellipse cx="560.0" cy="250.0" rx="240.0" ry="81.6" stroke-width="2.60" opacity="0.95"/>
      <ellipse cx="564.0" cy="248.2" rx="202.6" ry="68.9" stroke-width="2.46" opacity="0.89"/>
      <ellipse cx="568.0" cy="246.4" rx="168.0" ry="57.1" stroke-width="2.32" opacity="0.83"/>
      <ellipse cx="572.0" cy="244.6" rx="136.3" ry="46.4" stroke-width="2.18" opacity="0.77"/>
      <ellipse cx="576.0" cy="242.8" rx="107.7" ry="36.6" stroke-width="2.04" opacity="0.71"/>
      <ellipse cx="580.0" cy="241.0" rx="82.2" ry="27.9" stroke-width="1.90" opacity="0.65"/>
      <ellipse cx="584.0" cy="239.2" rx="60.0" ry="20.4" stroke-width="1.76" opacity="0.59"/>
      <ellipse cx="588.0" cy="237.4" rx="41.4" ry="14.1" stroke-width="1.62" opacity="0.53"/>
      <ellipse cx="592.0" cy="235.6" rx="26.8" ry="9.1" stroke-width="1.48" opacity="0.47"/>
      <ellipse cx="596.0" cy="233.8" rx="16.5" ry="5.6" stroke-width="1.34" opacity="0.41"/>
      <g stroke-width="1.2" opacity=".28">
        <path d="M800.0 250.0 L766.6 248.2 L736.0 246.4 L708.3 244.6 L683.7 242.8 L662.2 241.0 L644.0 239.2 L629.4 237.4 L618.8 235.6 L612.5 233.8 L612.0 232.0"/>

        <path d="M680.0 320.7 L665.3 307.9 L652.0 295.9 L640.2 284.7 L629.8 274.5 L621.1 265.2 L614.0 256.9 L608.7 249.6 L605.4 243.5 L604.3 238.7 L606.0 235.5"/>
        <path d="M560.0 331.6 L564.0 317.1 L568.0 303.5 L572.0 291.0 L576.0 279.4 L580.0 268.9 L584.0 259.6 L588.0 251.5 L592.0 244.7 L596.0 239.4 L600.0 236.1"/>

        <path d="M352.2 290.8 L388.5 282.6 L422.5 275.0 L453.9 267.8 L482.8 261.1 L508.8 255.0 L532.0 249.4 L552.1 244.4 L568.8 240.2 L581.7 236.6 L589.6 234.0"/>

        <path d="M352.2 209.2 L388.5 213.8 L422.5 217.8 L453.9 221.4 L482.8 224.5 L508.8 227.0 L532.0 229.0 L552.1 230.4 L568.8 231.0 L581.7 231.0 L589.6 230.0"/>

        <path d="M767.8 209.2 L739.5 213.8 L713.5 217.8 L690.1 221.4 L669.2 224.5 L651.2 227.0 L636.0 229.0 L623.9 230.4 L615.2 231.0 L610.3 231.0 L610.4 230.0"/>

    <circle class="core" cx="600" cy="232" r="22" fill="url(#whCore)" stroke="none"/>
    <circle cx="600" cy="232" r="3.2" fill="#fff" stroke="none"/>
  </svg>
</div>

<!-- Espera: logo, próximos da fila e últimas notas -->
<section class="scr" id="s-idle">
  <div class="idle">
    <div class="logo"><svg class="mark" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><mask id="tvBack" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"><rect width="48" height="48" fill="#fff"/><path d="M17 13H31L37 21L24 37L11 21Z" fill="#000" stroke="#000" stroke-width="3"/></mask><mask id="tvGap" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"><rect width="48" height="48" fill="#fff"/><path d="M45 24A21 6 0 0 1 3 24" stroke="#000" stroke-width="6" transform="rotate(-20 24 24)"/></mask></defs><g mask="url(#tvGap)"><path d="M17 13H31L37 21L24 37L11 21Z"/><path d="M11 21H37M17 13L21 21L24 37M31 13L27 21L24 37M21 21L24 13L27 21" stroke-width="1.4" opacity=".75"/></g><g transform="rotate(-20 24 24)"><path d="M3 24A21 6 0 0 1 45 24" mask="url(#tvBack)"/><path d="M45 24A21 6 0 0 1 3 24"/></g></svg>Amethyst<span class="by">By Ruan</span></div>
    <h1 id="idleTitle">Quem abre o show?</h1>
    <p class="hint" id="idleHint">Escolha sua música e coloque seu nome na fila</p>
    <div class="cols">
      <div class="box" id="nextBox">
        <span class="lbl">Próximos</span>
        <ol id="nextList"></ol>
      </div>
      <div class="box" id="lastBox">
        <span class="lbl">Notas da noite</span>
        <ol id="lastList"></ol>
      </div>
    </div>
  </div>
</section>

<!-- Apresentação de quem vai cantar -->
<section class="scr" id="s-intro" hidden>
  <div class="intro">
    <span class="lbl">Agora no palco</span>
    <div class="who" id="introWho"></div>
    <div class="song" id="introSong"></div>
    <div class="count" id="introCount">3</div>
  </div>
</section>

<!-- Vídeo -->
<section class="scr play" id="s-play" hidden>
  <video id="video" preload="auto"></video>
  <div class="verr" id="verr" hidden>Este vídeo não abriu nesta versão.</div>
  <aside class="lyrics" id="lyrics" hidden><div class="ly-scroll" id="lyScroll"></div></aside>
  <div class="lyband" id="lyBand" hidden><p class="lb-now" id="lbNow"></p><p class="lb-next" id="lbNext"></p></div>
</section>

<!-- YouTube na TV -->
<section class="scr play" id="s-yt" hidden>
  <div class="ytwrap" id="ytwrap"></div>
</section>

<!-- Sobreposições durante a música -->
<div class="hud" id="hud" hidden>
  <div class="hud-who" id="hudWho"></div>
  <div class="hud-score" id="hudScore">
    <canvas id="hudTrail" width="240" height="60"></canvas>
    <b id="hudTotal">0</b><small>%</small>
  </div>
  <div class="hud-next" id="hudNext" hidden></div>
  <div class="kstrip" id="kStrip" hidden>
    <span class="k-who" id="kWho"></span>
    <canvas id="kCanvas"></canvas>
    <span class="k-score"><b id="kTotal">0</b><small>pts</small></span>
  </div>
</div>

<!-- Nota -->
<section class="scr" id="s-result" hidden>
  <canvas class="cele" id="rCele" hidden aria-hidden="true"></canvas>
  <div class="result">
    <span class="lbl" id="rWho"></span>
    <div class="ring" id="rRing"><div><span id="rTotal">0</span><small>%</small></div></div>
    <div class="stars" id="rStars"></div>
    <div class="msg" id="rMsg"></div>
    <div class="brk" id="rBrk">
      <div><b id="rTune"></b><span>Afinação</span></div>
      <div><b id="rPres"></b><span>Presença</span></div>
      <div><b id="rStab"></b><span>Estabilidade</span></div>
    </div>
    <div class="rnext" id="rNext" hidden></div>
  </div>
</section>

<script src="bars.js"></script>
<script src="lyrics.js"></script>
<script src="celebrate.js"></script>
<script src="tv.js"></script>
</body>
</html>
